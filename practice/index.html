<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K-BUSINESS DAY 2026 상담일지 연습 (자유 입력)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  /* layout: one centred column for a tablet; summary strip on top, large touch targets, Korean first with small English beneath */
  --paper:#eef2f6; --card:#ffffff; --ink:#15233b; --muted:#5b6a80; --line:#d3dbe5;
  --accent:#0b5cad; --accent-ink:#ffffff; --accent-soft:#e2eefb;
  --good:#1c7c4a; --good-soft:#e1f3e8; --warn:#9a5b00; --warn-soft:#fdf0d5; --crit:#b3261e; --crit-soft:#fbe4e2;
  --font-body:"IBM Plex Sans KR","IBM Plex Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-latin:"IBM Plex Sans","IBM Plex Sans KR",sans-serif;
  --bar:#15233b; --bar-ink:#eef2f6; --alert:#f6c453; --alert-ink:#3b2700;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0e1622; --card:#172233; --ink:#e8eef6; --muted:#9aa9bd; --line:#2c3b50;
    --accent:#6eb1f5; --accent-ink:#08213d; --accent-soft:#1c3552;
    --good:#6fd39b; --good-soft:#163526; --warn:#f0bd62; --warn-soft:#3a2c10; --crit:#ff9a92; --crit-soft:#40201d;
    --bar:#1b2a42; --bar-ink:#eef2f6;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0e1622; --card:#172233; --ink:#e8eef6; --muted:#9aa9bd; --line:#2c3b50;
  --accent:#6eb1f5; --accent-ink:#08213d; --accent-soft:#1c3552;
  --good:#6fd39b; --good-soft:#163526; --warn:#f0bd62; --warn-soft:#3a2c10; --crit:#ff9a92; --crit-soft:#40201d;
    --bar:#1b2a42; --bar-ink:#eef2f6;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 120px}
.top{position:sticky;top:0;z-index:5;background:var(--bar);color:var(--bar-ink)}
.top-in{max-width:860px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:600;letter-spacing:.01em;font-family:var(--font-latin)}
.brand small{display:block;font-weight:400;font-size:13px;opacity:.75;font-family:var(--font-body)}
.grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:14px;font-weight:500;white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.p-good{background:var(--good-soft);color:var(--good)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-crit{background:var(--crit-soft);color:var(--crit)}
.p-mute{background:var(--accent-soft);color:var(--accent)}
#due{background:var(--alert);color:var(--alert-ink)}
#due>div{max-width:860px;margin:0 auto;padding:12px 16px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
#due .msg{display:flex;gap:12px;align-items:center;flex:1 1 320px;min-width:0}
#due .tag{flex:none;background:var(--alert-ink);color:var(--alert);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600}
#due b{font-weight:600;font-size:18px;display:block;line-height:1.3}
#due small{display:block;font-size:14px;opacity:.85;font-family:var(--font-latin)}
#due button{flex:none;font:inherit;font-weight:600;border:0;background:var(--alert-ink);color:var(--alert);border-radius:10px;padding:10px 20px;min-height:48px;cursor:pointer}
.back{background:transparent;border:1px solid currentColor;color:inherit;border-radius:10px;padding:8px 14px;min-height:44px}
h1{font-size:22px;margin:20px 0 4px;font-weight:600;text-wrap:balance}
h2{font-size:18px;margin:0 0 12px;font-weight:600}
.en{font-family:var(--font-latin);font-size:.76em;color:var(--muted);font-weight:400}
h2 .en{margin-left:8px}
.sub{color:var(--muted);font-size:15px;margin:0 0 16px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-top:16px}
.summary{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
.tile{flex:1 1 150px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.tile b{display:block;font-size:26px;font-family:var(--font-latin);font-variant-numeric:tabular-nums;font-weight:600}
.tile span{font-size:14px;color:var(--muted)}
.mlist{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.mcard{display:grid;grid-template-columns:96px 1fr auto;gap:14px;align-items:center;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:var(--r);padding:16px;min-height:88px}
.mcard.done{border-left-color:var(--good)} .mcard.wait{border-left-color:var(--warn)}
.slot{font-family:var(--font-latin);font-variant-numeric:tabular-nums;font-weight:600;font-size:19px}
.slot small{display:block;font-weight:400;font-size:13px;color:var(--muted);font-family:var(--font-body)}
.who b{display:block;font-family:var(--font-latin);font-weight:600}
.who span{font-family:var(--font-latin);color:var(--muted);font-size:15px}
.mact{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.link{background:none;border:0;color:var(--accent);text-decoration:underline;padding:6px 0;min-height:36px}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.seg.s4{grid-template-columns:repeat(4,1fr)} .seg.s2{grid-template-columns:repeat(2,1fr)}
.chip{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:56px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;text-align:left;line-height:1.25;font-weight:500}
.chip .en{display:block;margin-top:2px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] .en{color:var(--accent-ink);opacity:.85}
.field{margin-top:16px}
.field>label,.flabel{display:block;font-weight:500;margin-bottom:8px}
.req{color:var(--crit);font-size:13px;margin-left:6px;font-weight:500}
input[type=text],input[type=date],input[type=month],textarea{width:100%;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;min-height:52px}
textarea{min-height:110px;resize:vertical}
input.num{font-family:var(--font-latin);font-size:24px;font-variant-numeric:tabular-nums;font-weight:500;max-width:300px}
.pcard{border:1.5px solid var(--line);border-radius:var(--r);padding:16px;margin-top:12px}
.pcard.on{border-color:var(--accent)}
.phead{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.thumb{width:76px;height:76px;border:0;padding:0;background:none;border-radius:10px;flex:none;cursor:zoom-in}
.thumb svg,.zoomimg svg{display:block;width:100%;height:100%;border-radius:10px}
.zoomimg{width:min(100%,420px);margin:0 auto}
.pname{font-family:var(--font-latin);font-weight:600;font-size:18px;flex:1 1 220px}
.pname small{display:block;font-weight:400;font-size:13px;color:var(--muted);font-family:var(--font-body)}
.toggle{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:10px 18px;min-height:48px;font-weight:500}
.toggle[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rlist{display:flex;flex-direction:column;gap:10px}
.rcard{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--paper)}
.rcard b{font-weight:600}
.rcard p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.btn{border:0;border-radius:10px;padding:12px 20px;min-height:52px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.danger{background:transparent;color:var(--crit);border:1.5px solid var(--crit)}
.btn.big{width:100%;min-height:64px;font-size:19px}
.btn.small{min-height:44px;padding:8px 14px;font-weight:500}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{border-radius:10px;padding:12px 14px;font-size:15px;margin-top:12px}
.n-info{background:var(--accent-soft);color:var(--ink)}
.n-warn{background:var(--warn-soft);color:var(--warn)}
.n-crit{background:var(--crit-soft);color:var(--crit)}
.note ul{margin:6px 0 0;padding-left:20px}
.ovl{position:fixed;inset:0;background:rgba(10,18,30,.55);z-index:20;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:24px 12px}
.sheet{background:var(--card);border-radius:16px;width:100%;max-width:760px;padding:20px}
.sheet h2{display:flex;justify-content:space-between;align-items:center;gap:12px}
.smp{border:1px dashed var(--line);border-radius:10px;padding:12px;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:16px}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
td.n,th.n{text-align:right;font-family:var(--font-latin);font-variant-numeric:tabular-nums}
tfoot td{font-weight:600;border-bottom:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:999px;z-index:30;font-weight:500}
.proto{margin-top:28px;font-size:14px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
@media (max-width:560px){
  .mcard{grid-template-columns:1fr}.mact{align-items:flex-start;flex-direction:row}
  .seg.s4{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion:no-preference){.chip,.toggle,.btn{transition:background-color .12s,border-color .12s}}
</style>
</head>

const SERVER={
 limit:1000000,
 price:{'FOD-K-001-P1':[2.6,24,36000,72000],'FOD-K-001-P2':[1.5,12,30000,60000],'FOD-K-001-P3':[0.9,100,120000,240000],'LIF-K-001-P1':[3.9,40,30000,60000],'LIF-K-001-P2':[6.5,20,0,0],'MED-K-001-P1':[4.5,100,100000,200000],'MED-K-001-P2':[18,10,12000,24000],'TEX-K-001-P1':[5.2,50,40000,80000],'TEX-K-001-P2':[0,10,0,0],'BEA-K-001-P1':[0.8,200,400000,800000],'BEA-K-001-P2':[3.2,48,60000,120000],'BAB-K-001-P1':[1.2,24,48000,96000],'BAB-K-001-P2':[2.4,50,60000,120000],'STA-K-001-P1':[3.0,40,80000,160000],'STA-K-001-P2':[0.7,100,200000,400000]},
 compute(mt,st){
  const rows=[];let annual=0,once=0;
  if(st.status==='STATUS_Held') mt.products.forEach(p=>{
   const l=st.lines[p.no];const q=num(l.qty);if(!l.discussed||!q||!l.unit)return;
   const t=this.price[mt.coNo+'-'+p.no]||[0,0,0,0];const ui=C.UNIT.findIndex(u=>u[0]===l.unit);
   const pieces=[q,q*t[1],q*t[2],q*t[3]][ui];
   const val=p.conv[ui]?pieces*t[0]:(num(l.usd)||0);
   const f={PERIOD_Month:12,PERIOD_Quarter:4,PERIOD_Year:1}[l.period];
   const a=f?val*f:0,o=f?0:val;annual+=a;once+=o;
   rows.push({name:p.name,vol:volText(l),annual:a,once:o,direct:!p.conv[ui]});
  });
  return {rows,annual,once,large:annual>this.limit||once>this.limit};
 }
};

function dueMeeting(){

}

function pendingInner(){const s=st();if(s.status!=='STATUS_Held')return '';const e=validate(mt(),s);

function validate(m,s){
 const e=[];if(s.status!=='STATUS_Held')return e;
 const disc=m.products.filter(p=>s.lines[p.no].discussed);
 if(!disc.length)e.push('제품을 1개 이상 선택하세요.');
 let anyVol=false;
 disc.forEach(p=>{const l=s.lines[p.no];if(!l.qty)return;const q=num(l.qty);
  if(q===null||q<=0){e.push(`${p.name}: 물량은 0보다 큰 숫자로 입력하세요.`);return;}
  anyVol=true;if(!l.unit){e.push(`${p.name}: 단위를 고르세요.`);return;}
  const ui=C.UNIT.findIndex(u=>u[0]===l.unit);if(!p.conv[ui]){const u=num(l.usd);if(u===null||u<=0)e.push(`${p.name}: USD 총액을 입력하세요.`);}
  if(!(l.note||'').trim())e.push(`${p.name}: 이 물량의 조건·배경을 적어 주세요.`);});
 if(s.coop.includes('COOP_Other')&&!s.coopOther.trim())e.push('희망 거래 형태 기타 내용을 한 줄로 적어 주세요.');
 return e;
}
function validateDraft(r){
 const e=[];if(!r.type){e.push('요청 유형을 고르세요.');return e;}
 if((PRODUCT_REQ.includes(r.type)||r.type==='REQ_Other')&&!r.product)e.push('어느 제품의 요청인지 고르세요.');
 if(r.type==='REQ_Other'&&!r.otherNote.trim())e.push('기타 요청 내용을 한 줄로 적어 주세요.');
 if(r.details.some(c=>/_Other$/.test(c))&&!r.detailName.trim())e.push('세부 선택의 기타 내용을 한 줄로 적어 주세요.');
 if(r.type==='REQ_Sample'&&!(r.sampleNote||'').trim())e.push('샘플 내용을 한 줄로 적어 주세요.');
 if(r.resp==='RSP_Other'&&!r.respNote.trim())e.push('기타 대응 내용을 한 줄로 적어 주세요.');
 if(r.resp==='RSP_Accepted'){
  if(SENDBY_REQ.includes(r.type)){if(!r.send)e.push('발송 기한을 고르세요.');else if(r.send==='SEND_Date'&&!r.sendDate)e.push('발송 날짜를 입력하세요.');}
  if(r.type==='REQ_FollowUp'&&!r.fuMethod)e.push('후속 미팅·통화 방법을 고르세요.');}
 return e;
}

   S.extra.push({id:nid,buyerNo:desk.buyer,slot:n,mode,coNo:id});S.m[nid]=blankM(mkMeeting(nid,desk.buyer,n,mode,id));S.m[nid].seen=false;save();desk.pick=null;keepScroll(render);toast('등록했습니다: '+nid);return;}

  case 'status':s.status=v;break;

  case 'unit':s.lines[id].unit=s.lines[id].unit===v?'':v;s.lines[id].usd='';break;
  case 'period':s.lines[id].period=v;break;
  case 'timing':s.lines[id].timing=v;break;

  case 'addreq':draft=newDraft(id||'COMMON');render();return;

  case 'ddetail':if(DETAIL[draft.type][1]==='single')draft.details=draft.details[0]===v?[]:[v];else tog(draft.details,v);if(!draft.details.some(c=>/_Other$/.test(c))&&draft.type!=='REQ_CertDocs')draft.detailName='';render();return;

  case 'dsave':{draft.err=validateDraft(draft);if(draft.err.length){render();$('overlay').firstChild.scrollTop=0;return;}
   const r=JSON.parse(JSON.stringify(draft));const idx=r.idx;delete r.idx;delete r.err;if(r.type!=='REQ_Sample')r.sampleNote='';if(!SWITCHABLE.includes(r.type))r.dir='REQDIR_B2C';
   if(idx==null)s.requests.push(r);else s.requests[idx]=r;draft=null;save();keepScroll(render);toast('요청을 저장했습니다');return;}
  case 'submit':issues=validate(m,s);if(issues.length){render();const el=$('issues');if(el)el.scrollIntoView({block:'start'});return;}
   confirmBox={large:!offline&&SERVER.compute(m,s).large};render();return;
  case 'cedit':confirmBox=null;render();return;

   s.submittedAt=new Date().toISOString();s.sent=false;s.result=null;confirmBox=null;issues=[];save();view={name:'list',id:null};render();window.scrollTo(0,0);
   toast(offline?'제출했습니다. 연결되면 전송됩니다':'제출했습니다');flush();return;
 }
 save();keepScroll(render);
});
document.addEventListener('input',ev=>{
 const k=ev.target.dataset.bind;if(!k)return;const v=ev.target.value,p=k.split(':');
 if(p[0]==='setup'){setupForm[p[1]]=v;return;}
 if(p[0]==='desk'){desk[p[1]]=v;if(p[1]==='q'){keepScroll(render);const el=$('k-q');if(el){el.focus();try{el.setSelectionRange(v.length,v.length);}catch(e){}}}return;}
 if(p[0]==='line'){
  const sig=()=>{const s=st(),m=mt();return m.products.map(x=>{const l=s.lines[x.no];const q=num(l.qty);return (l.qty?1:0)+':'+(q===null?0:1);}).join('|');};
  const before=sig();st().lines[p[1]][p[2]]=v;save();
  if(before!==sig()){const id=ev.target.id;keepScroll(render);const el=$(id);if(el){el.focus();try{el.setSelectionRange(el.value.length,el.value.length);}catch(e){}}}
  else{const pe=$('pending');if(pe)pe.innerHTML=pendingInner();}
  return;
 }
 else if(p[0]==='d'){if(p[1]==='smp')draft.samples[+p[2]].qty=v;else draft[p[1]]=v;return;}
 else st()[k]=v;
 save();{const pe=$('pending');if(pe&&view.name==='meet')pe.innerHTML=pendingInner();}
});
render();flush();setInterval(drawDue,30000);
